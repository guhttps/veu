# Configuração de exemplo para o Véu como gateway central da empresa.

[deteccao]
detectores = ["padroes", "nomes", "enderecos", "segredos"]
# Dados da própria empresa que podem ir para a IA.
ignorar = ["contato@minhaempresa.example"]
ignorar_padroes = ['@minhaempresa\.example$']

[anonimizacao]
operador = "token"

[politica]
# Chaves privadas nunca saem, nem escondidas.
bloquear = ["CHAVE_PRIVADA"]
# Opcional: requisições com documentos vão inteiras para um modelo interno, em vez de serem escondidas.
# desviar_para = "interno"
# modelo_desvio = "llama3.1:70b"
# desviar_tipos = ["CPF", "CNPJ", "CARTAO_CREDITO"]

[servidor]
host = "0.0.0.0"
porta = 8787
playground = false
log_auditoria = "-"
segredo_auditoria_env = "VEU_SEGREDO_AUDITORIA"
injetar_chaves = true
token_env = "VEU_TOKEN"
# Lê links do Notion e do Google enviados nas mensagens e manda o conteúdo já protegido (NOTION_TOKEN no .env).
expandir_links = false

# Opcional: cada linha da auditoria também vai para o SIEM (só metadados, com o hash da cadeia).
# [siem]
# syslog = "tls://siem.interna:6514"
# hec_url = "https://splunk.interna:8088/services/collector/event"
# hec_token_env = "VEU_HEC_TOKEN"

# Opcional: login único. JWTs do provedor de identidade valem como token; os grupos escolhem a equipe.
# [oidc]
# emissor = "https://login.microsoftonline.com/<tenant>/v2.0"
# publico = "api://veu"
# claim_equipe = "groups"
# claim_usuario = "preferred_username"   # registra quem fez a requisição na auditoria

# Uma seção por equipe, com o token no .env (ou grupos_oidc, com [oidc]). A auditoria e as métricas mostram a equipe.
[equipes.atendimento]
token_env = "VEU_TOKEN_ATENDIMENTO"
# grupos_oidc = ["<id do grupo no Entra ID>"]

[equipes.juridico]
token_env = "VEU_TOKEN_JURIDICO"
bloquear = ["CARTAO_CREDITO", "CHAVE_PRIVADA"]

# Modelo interno para o desvio (descomente desviar_para acima).
# [provedores.interno]
# tipo = "openai"
# url = "http://vllm.interno:8000/v1"
