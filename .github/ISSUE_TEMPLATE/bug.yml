name: Bug
description: Algo não funciona como deveria (proxy, integração, CLI).
labels: ["bug"]
body:
  - type: textarea
    id: descricao
    attributes:
      label: O que aconteceu
    validations:
      required: true
  - type: textarea
    id: reproduzir
    attributes:
      label: Como reproduzir (com dados fictícios)
      render: text
  - type: input
    id: ambiente
    attributes:
      label: Versão do Véu, do Python e do sistema
      placeholder: veu 0.1.0, Python 3.13, Windows 11
