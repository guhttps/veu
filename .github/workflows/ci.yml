name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install "ruff>=0.6"
      - run: ruff check .

  tests:
    name: Testes (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  benchmark:
    name: Benchmark (vazamento máximo de 5%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - name: Avaliar
        run: |
          set -o pipefail
          veu avaliar --quantidade 1000 --max-vazamento 0.05 | tee resultado.md
          { echo "# Benchmark do Véu"; cat resultado.md; } >> "$GITHUB_STEP_SUMMARY"

  javascript:
    name: JavaScript (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24", "26"]
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - name: Conformidade com a versão em Python está em dia
        run: |
          python ../scripts/gerar_conformidade.py
          git diff --exit-code -- test/conformidade.json
      - name: Tipos
        if: matrix.node-version == '26'
        run: npm run typecheck
      - run: npm run build
      - name: Testes
        run: |
          if [ "${{ matrix.node-version }}" = "22" ]; then
            # Para não depender da execução direta de TypeScript, o Node 22 testa a versão compilada.
            npx tsc -p tsconfig.json --noEmit false --outDir build-test --rewriteRelativeImportExtensions
            cp test/*.json build-test/test/
            node --test "build-test/test/*.test.js"
          else
            npm test
          fi

  instalador:
    name: Instalador (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip wheel . --no-deps -w wheelhouse
      - name: Linux e macOS (o mesmo comando que a pessoa cola no Terminal)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export VEU_SEM_ABRIR=1 VEU_PACOTE="veu[servidor,mcp,documentos] @ file://$PWD/$(ls wheelhouse/*.whl)"
          sh web/instalar.sh
          "$HOME/.local/bin/veu" --versao
          "$HOME/.local/bin/veu" demonstrar
          ls "$HOME/.local/share/applications/veu.desktop" 2>/dev/null || ls "$HOME"/Desktop/*.command
      - name: Windows (o mesmo comando que a pessoa cola no PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $whl = (Get-ChildItem wheelhouse\*.whl).FullName -replace '\\', '/'
          $env:VEU_SEM_ABRIR = "1"
          $env:VEU_PACOTE = "veu[servidor,mcp,documentos] @ file:///$whl"
          Get-Content web\instalar.ps1 -Raw | Invoke-Expression
          & "$env:USERPROFILE\.local\bin\veu.exe" demonstrar
          Test-Path (Join-Path ([Environment]::GetFolderPath('Desktop')) 'Véu.lnk')

  helm:
    name: Chart Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/veu --strict
      - run: helm template teste deploy/helm/veu --set serviceMonitor.enabled=true --set redis.enabled=true > /dev/null

  litellm:
    name: Guardrail do LiteLLM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev,litellm]"
      - run: python -m pytest tests/test_litellm.py -p no:warnings

  navegador:
    name: Extensão e página (Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Biblioteca JavaScript
        working-directory: js
        run: npm ci && npm run build
      - run: python scripts/empacotar_navegador.py
      - name: Teste de ponta a ponta num Chrome de verdade
        run: node extensao/teste/e2e.mjs "$(command -v google-chrome || command -v chromium)"
      - uses: actions/upload-artifact@v7
        with:
          name: extensao
          path: dist/veu-extensao-*.zip

  package:
    name: Pacote instalável
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - name: Instalar o wheel num ambiente limpo
        run: |
          python -m venv /tmp/limpo
          /tmp/limpo/bin/pip install dist/*.whl
          /tmp/limpo/bin/veu --versao
          resultado=$(echo "Sou a Maria Souza, CPF 529.982.247-25" | /tmp/limpo/bin/veu anonimizar 2>/dev/null)
          echo "$resultado"
          test "$resultado" = "Sou a [PESSOA_1], CPF [CPF_1]"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  action:
    name: GitHub Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Repositório de teste com um CPF
        run: |
          mkdir -p "$RUNNER_TEMP/teste" && cd "$RUNNER_TEMP/teste" && git init -q
          echo 'cpf = "529.982.247-25"' > dados.py
          echo 'print("ok")' > limpo.py
          git add .
      - uses: ./
        id: sujo
        continue-on-error: true
        with:
          diretorio: ${{ runner.temp }}/teste
          sarif: ${{ runner.temp }}/veu.sarif
      - name: A action precisa falhar e gerar o SARIF
        env:
          RESULTADO: ${{ steps.sujo.outcome }}
          ENCONTRADOS: ${{ steps.sujo.outputs.encontrados }}
        run: |
          test "$RESULTADO" = "failure"
          test "$ENCONTRADOS" = "1"
          python -c "import json, os; d = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'veu.sarif'))); assert d['runs'][0]['results'][0]['ruleId'] == 'CPF'"
      - name: Arquivo sem dados passa
        uses: ./
        with:
          diretorio: ${{ runner.temp }}/teste
          caminhos: limpo.py

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t veu .
      - name: Teste de fumaça
        run: |
          docker run -d --name veu -p 8787:8787 -e VEU_TOKEN=ci veu
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8787/veu/saude && break; sleep 1; done
          curl -fs http://127.0.0.1:8787/veu/saude
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8787/veu/v1/detectar -d '{}')" = "401"
          curl -fs http://127.0.0.1:8787/veu/v1/anonimizar -H "X-Veu-Token: ci" -H "Content-Type: application/json" \
            -d '{"texto": "CPF 529.982.247-25"}' | tee resposta.json
          grep -q '"texto":"CPF \[CPF_1\]"' resposta.json
      - if: failure()
        run: docker logs veu
