name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Conferir versão da tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('src/veu/__init__.py', encoding='utf-8').read()).group(1))")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "A tag ${GITHUB_REF_NAME} não bate com __version__ $version"; exit 1; }
      - run: python -m pip install -e ".[dev]" build
      - run: python -m pytest
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      # Biblioteca JavaScript, extensão e página: ficam em extras/ (o PyPI só aceita os arquivos do Python).
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Biblioteca JavaScript e extensão
        run: |
          mkdir -p extras
          (cd js && npm ci && npm run build && npm test && npm pack --pack-destination ../extras)
          python scripts/empacotar_navegador.py
          mv dist/veu-extensao-*.zip extras/
      - uses: actions/upload-artifact@v7
        with:
          name: extras
          path: extras/

  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v7
        with:
          name: extras
          path: dist/
      - name: Notas a partir do CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v header="## [$version]" '
            index($0, header) == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > notas.md
          test -s notas.md
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Véu $GITHUB_REF_NAME" --notes-file notas.md

  # Publicação no PyPI por "trusted publishing". Para ativar: configure o projeto no PyPI
  # (Publishing > GitHub) e crie a variável de repositório PYPI_PUBLICAR = true.
  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && vars.PYPI_PUBLICAR == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Imagem Docker em ghcr.io/guhttps/veu (usada pelo chart Helm em deploy/helm/veu).
  docker:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: versao
        run: echo "valor=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.versao.outputs.valor }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.versao.outputs.valor }}

  # Publicação no npm por "trusted publishing". Para ativar: configure o pacote veu-js no npm
  # (Settings > Trusted publishing > GitHub Actions) e crie a variável de repositório NPM_PUBLICAR = true.
  npm:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && vars.NPM_PUBLICAR == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - working-directory: js
        run: npm ci && npm run build && npm publish --provenance --access public
